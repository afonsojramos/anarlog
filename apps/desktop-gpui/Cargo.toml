[package]
name = "desktop-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anlg-audio = { workspace = true }
anlg-audio-actual = { workspace = true }
anlg-audio-utils = { workspace = true }
anlg-db-execute = { workspace = true }
anlg-listener-core = { workspace = true }
anlg-listener2-core = { workspace = true }
anlg-notification-interface = { workspace = true }
anlg-storage = { workspace = true }
anlg-template-app = { workspace = true }
anlg-tiptap = { workspace = true }
anlg-transcript = { workspace = true }
anyhow = { workspace = true }
desktop-runtime = { path = "../../crates/desktop-runtime" }
futures = "0.3"
global-hotkey = "=0.8.0"
gpui = "=0.2.2"
ractor = { workspace = true }
rfd = { version = "=0.16.0", default-features = false, features = ["xdg-portal", "wayland", "async-std"] }
rodio = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-segmentation = "=1.13.2"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
anlg-audio-mock = { workspace = true }
tempfile = { workspace = true }
